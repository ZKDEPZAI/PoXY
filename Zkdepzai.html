<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Proxy - Premium Client</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, update, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMMg5mmBczaHIKYGitE1ksq6KOGrxGy_8",
            authDomain: "aimlock-9e6bf.firebaseapp.com",
            databaseURL: "https://aimlock-9e6bf-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "aimlock-9e6bf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const proxyConfigs = {
            "p1": { name: "AIMDRAG (FFMAX)", ip: "103.82.26.117", port: "1713", crt: "https://www.mediafire.com/file/871e00sylc4ajl3/mitmproxy-ca-cert_11.pem/file" },
            "p2": { name: "AIMDRAG + ANTENNA", ip: "103.82.26.117", port: "1712", crt: "https://www.mediafire.com/file/871e00sylc4ajl3/mitmproxy-ca-cert_11.pem/file" },
            "p3": { name: "AIM BODY", ip: "92.118.206.166", port: "30477", crt: "https://www.mediafire.com/file/znau3jbnj2ubs6m/AimBung-Long.pem/file" }
        };

        let selectedCrt = "";

        // 1. Lấy IP thật của người dùng
        async function getUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (e) { return "0.0.0.0"; }
        }

        // 2. Lấy Nickname thật từ ID Free Fire (Sử dụng API trung gian miễn phí)
        window.fetchGameProfile = async () => {
            const id = document.getElementById('idGame').value.trim();
            const profileBox = document.getElementById('game-profile-card');
            const nameEl = document.getElementById('pf-nickname');
            
            if(id.length >= 8) {
                profileBox.style.display = 'flex';
                nameEl.innerText = "🔍 Đang tìm tên...";
                try {
                    // API trung gian kiểm tra ID
                    const res = await fetch(`https://thanhson24h.vn/api/checkidff.php?id=${id}`);
                    const data = await res.json();
                    if(data && data.name) {
                        nameEl.innerText = data.name;
                        document.getElementById('pf-level').innerText = "Thành viên Free Fire";
                    } else {
                        nameEl.innerText = "Không tìm thấy ID này";
                    }
                } catch (e) {
                    nameEl.innerText = "PLAYER_" + id.substring(0,4); // Backup nếu API lỗi
                }
                document.getElementById('pf-id').innerText = "ID: " + id;
            } else {
                profileBox.style.display = 'none';
            }
        };

        window.switchTab = (n) => {
            const gd = document.getElementById('tab-gd');
            const tc = document.getElementById('tab-tc');
            const btnGd = document.getElementById('btn-gd');
            const btnTc = document.getElementById('btn-tc');
            if(n === 'gd') {
                gd.style.display = 'block'; tc.style.display = 'none';
                btnGd.classList.add('active'); btnTc.classList.remove('active');
            } else {
                gd.style.display = 'none'; tc.style.display = 'block';
                btnGd.classList.remove('active'); btnTc.classList.add('active');
            }
        };

        window.checkActivation = () => {
            const key = document.getElementById('inputKey').value.trim();
            const idUser = document.getElementById('idGame').value.trim();
            if(!key || !idUser) return alert("Vui lòng nhập Key và ID!");
            
            const selectObj = document.getElementById('proxyMode');
            const gameName = selectObj.options[selectObj.selectedIndex].text;
            const nickName = document.getElementById('pf-nickname').innerText;
            
            document.getElementById('confirm-id').innerText = idUser + " (" + nickName + ")";
            document.getElementById('confirm-game').innerText = gameName;
            document.getElementById('popupConfirm').style.display = 'flex';
        };

        window.confirmAction = async (isNew) => {
            const key = document.getElementById('inputKey').value.trim();
            const idUser = document.getElementById('idGame').value.trim();
            const nickName = document.getElementById('pf-nickname').innerText;
            const mode = document.getElementById('proxyMode').value;
            const gameName = document.getElementById('confirm-game').innerText;
            
            try {
                const snap = await get(child(ref(db), `keys/${key}`));
                if (snap.exists()) {
                    const realIP = await getUserIP();
                    const updates = {};
                    updates[`/keys/${key}/userIP`] = realIP;
                    updates[`/keys/${key}/idGame`] = idUser;
                    updates[`/keys/${key}/nickName`] = nickName;
                    updates[`/keys/${key}/gameMode`] = gameName;
                    updates[`/keys/${key}/lastUpdate`] = new Date().toLocaleString();
                    if(isNew) updates[`/keys/${key}/status`] = "Activated";

                    await update(ref(db), updates);
                    
                    alert(`✅ THÀNH CÔNG!\nĐã cập nhật IP: ${realIP}\nChào mừng: ${nickName}`);
                    document.getElementById('popupConfirm').style.display = 'none';
                    
                    // Hiện màn hình thông số
                    const config = proxyConfigs[mode];
                    document.getElementById('info-title').innerText = config.name;
                    document.getElementById('info-ip').innerText = config.ip;
                    document.getElementById('info-port').innerText = config.port;
                    selectedCrt = config.crt;
                    document.getElementById('main-content').style.display = 'none';
                    document.getElementById('info-screen').style.display = 'block';
                } else { alert("❌ Key không tồn tại!"); }
            } catch (e) { alert("⚠️ Lỗi kết nối!"); }
        };

        window.lookupKey = async () => {
            const key = document.getElementById('lookKeyInput').value.trim();
            if(!key) return alert("Nhập Key!");
            try {
                const snap = await get(child(ref(db), `keys/${key}`));
                if (snap.exists()) {
                    const d = snap.val();
                    alert(`THÔNG TIN KEY:\n- Hạn: ${d.expiryDate || 'N/A'}\n- IP: ${d.userIP || 'Chưa có'}\n- Nickname: ${d.nickName || 'Chưa có'}\n- ID: ${d.idGame || 'Chưa có'}`);
                } else { alert("Key không đúng!"); }
            } catch (e) { alert("Lỗi!"); }
        };

        window.downloadCrt = () => { if(selectedCrt) window.open(selectedCrt, '_blank'); };
        window.copyText = (id) => {
            navigator.clipboard.writeText(document.getElementById(id).innerText);
            alert("Đã sao chép!");
        };
    </script>

    <style>
        :root { --bg: #080a0c; --card: #12161b; --accent: #00ffcc; --sub: #1c2128; }
        body { background: var(--bg); color: white; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: var(--card); width: 340px; padding: 25px; border-radius: 30px; border: 1px solid #222; text-align: center; margin-bottom: 20px; }
        #game-profile-card { 
            background: #0a0c10; border-radius: 15px; padding: 12px; margin-bottom: 12px;
            display: none; align-items: center; gap: 12px; text-align: left;
            border: 1px solid var(--accent); animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .avatar { width: 40px; height: 40px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; font-weight: bold; }
        .tabs { display: flex; background: #0a0c10; border-radius: 12px; padding: 4px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 10px; border: none; background: none; color: #555; cursor: pointer; font-weight: bold; border-radius: 8px; }
        .tab.active { background: var(--sub); color: white; }
        input, select { width: 100%; box-sizing: border-box; background: #0a0c10; border: 1px solid #222; color: white; padding: 14px; border-radius: 12px; margin-bottom: 10px; outline: none; }
        .btn-main { width: 100%; padding: 16px; background: linear-gradient(90deg, #5de0e6, #00ffcc); border: none; border-radius: 12px; color: #000; font-weight: bold; cursor: pointer; }
        .info-box { background: #0a0c10; border-radius: 15px; padding: 12px; border: 1px solid var(--sub); margin-bottom: 10px; }
        .val { font-size: 20px; font-family: monospace; color: white; margin: 5px 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 9999; }
    </style>
</head>
<body>

<div id="main-content">
    <div class="container">
        <h1 style="color: var(--accent); margin: 0;">DELTA<span style="color:white">PROXY</span></h1>
        <div class="tabs">
            <button id="btn-gd" class="tab active" onclick="switchTab('gd')">GIAO DỊCH</button>
            <button id="btn-tc" class="tab" onclick="switchTab('tc')">TRA CỨU</button>
        </div>

        <div id="tab-gd">
            <input type="text" id="inputKey" placeholder="Nhập Key">
            <input type="number" id="idGame" placeholder="Nhập ID Free Fire" oninput="fetchGameProfile()">
            
            <div id="game-profile-card">
                <div class="avatar">FF</div>
                <div class="profile-info">
                    <b id="pf-nickname" style="color: var(--accent);">Đang quét...</b><br>
                    <span id="pf-level" style="font-size: 11px; color: #888;"></span><br>
                    <span id="pf-id" style="font-size: 11px; color: #888;"></span>
                </div>
            </div>

            <select id="proxyMode">
                <option value="p1">AimDrag (FFMAX)</option>
                <option value="p2">AimDrag + Antenna</option>
                <option value="p3">Aim Body</option>
            </select>
            <button class="btn-main" onclick="checkActivation()">XÁC NHẬN</button>
        </div>

        <div id="tab-tc" style="display: none;">
            <input type="text" id="lookKeyInput" placeholder="Nhập Key tra cứu">
            <button class="btn-main" style="background: var(--sub); color: white;" onclick="lookupKey()">KIỂM TRA</button>
        </div>
    </div>
</div>

<div id="popupConfirm" class="overlay">
    <div class="container" style="width: 280px; border: 2px solid var(--accent);">
        <h3 style="color: var(--accent);">XÁC NHẬN</h3>
        <p style="font-size: 12px; color: #888;">ID & NICKNAME: <br><span id="confirm-id" style="color: white; font-weight: bold;"></span></p>
        <p style="font-size: 12px; color: #888;">BẢN MOD: <br><span id="confirm-game" style="color: var(--accent); font-weight: bold;"></span></p>
        
        <button class="btn-main" style="background: white; color: black; margin-top: 10px;" onclick="confirmAction(true)">KÍCH HOẠT MỚI</button>
        <button class="btn-main" style="background: #0d1117; color: white; border: 1px solid #333; margin-top: 8px;" onclick="confirmAction(false)">CẬP NHẬT IP</button>
        <p style="color: #ff4d4d; cursor: pointer; margin-top: 15px; font-weight: bold;" onclick="document.getElementById('popupConfirm').style.display='none'">[ HỦY ]</p>
    </div>
</div>

<div id="info-screen" class="container" style="display: none;">
    <h2 id="info-title" style="color: var(--accent); font-size: 16px;"></h2>
    <div class="info-box"><div style="font-size:10px; color:#666">IP</div><div class="val" id="info-ip"></div></div>
    <div style="display: flex; gap: 10px;">
        <div class="info-box" style="flex: 1;"><div style="font-size:10px; color:#666">PORT</div><div class="val" id="info-port"></div></div>
        <div class="info-box" style="flex: 1;" onclick="downloadCrt()"><div style="font-size:10px; color:#666">CERT</div><div style="font-size: 20px;">🛡️</div></div>
    </div>
    <button class="btn-main" style="background:#000; color:white; border:1px solid #333;" onclick="location.reload()">THOÁT</button>
</div>

</body>
</html>
